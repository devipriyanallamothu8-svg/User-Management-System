<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Registration</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
            background: linear-gradient(135deg, #141e30, #243b55);
            color: white;
        }

        .container {
            width: 100%;
            max-width: 650px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 25px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
        }

        .icon {
            width: 75px;
            height: 75px;
            margin: 0 auto 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            font-size: 34px;
            background: linear-gradient(135deg, #6c63ff, #00c6ff);
        }

        h1 {
            text-align: center;
            font-size: 32px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 30px;
        }

        form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .group {
            display: flex;
            flex-direction: column;
        }

        .full {
            grid-column: 1 / -1;
        }

        label {
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 10px;
            outline: none;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 15px;
        }

        input::placeholder,
        textarea::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #00c6ff;
            box-shadow: 0 0 10px rgba(0, 198, 255, 0.25);
        }

        select option {
            color: black;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        .gender-box {
            display: flex;
            gap: 18px;
            padding-top: 10px;
        }

        .gender-box label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: normal;
        }

        .gender-box input {
            width: auto;
        }

        .button-area {
            grid-column: 1 / -1;
            margin-top: 10px;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 11px;
            background: linear-gradient(135deg, #6c63ff, #00c6ff);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 28px rgba(0, 198, 255, 0.35);
        }

        .links {
            text-align: center;
            margin-top: 22px;
        }

        .links a {
            color: #00c6ff;
            text-decoration: none;
            font-weight: 600;
        }

        .links a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            form {
                grid-template-columns: 1fr;
            }

            .full,
            .button-area {
                grid-column: auto;
            }

            .container {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="icon">📝</div>

        <h1>Create Account</h1>

        <p class="subtitle">
            Register a new user in the User Management System
        </p>

        <!-- IMPORTANT: action must match @WebServlet("/register") -->
        <form action="register" method="post">

            <!-- Username -->
            <div class="group">
                <label for="username">Username</label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Create a username"
                    required>
            </div>

            <!-- Full Name -->
            <div class="group">
                <label for="name">Full Name</label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required>
            </div>

            <!-- Email -->
            <div class="group">
                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required>
            </div>

            <!-- Password -->
            <div class="group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    required>
            </div>

            <!-- Phone -->
            <div class="group">
                <label for="phone">Phone Number</label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter phone number"
                    required>
            </div>

            <!-- Course -->
            <div class="group">
                <label for="course">Course</label>

                <select id="course" name="course" required>
                    <option value="">Select Course</option>
                    <option value="CSE">Computer Science Engineering</option>
                    <option value="ECE">Electronics & Communication Engineering</option>
                    <option value="EEE">Electrical & Electronics Engineering</option>
                    <option value="MECH">Mechanical Engineering</option>
                    <option value="CIVIL">Civil Engineering</option>
                </select>
            </div>

            <!-- Gender -->
            <div class="group full">

                <label>Gender</label>

                <div class="gender-box">

                    <label>
                        <input
                            type="radio"
                            name="gender"
                            value="Male"
                            required>
                        Male
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="gender"
                            value="Female">
                        Female
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="gender"
                            value="Other">
                        Other
                    </label>

                </div>

            </div>

            <!-- Address -->
            <div class="group full">

                <label for="address">Address</label>

                <textarea
                    id="address"
                    name="address"
                    placeholder="Enter your address"
                    required></textarea>

            </div>

            <!-- Submit -->
            <div class="button-area">

                <button type="submit">
                    Register User →
                </button>

            </div>

        </form>

        <div class="links">

            <p>
                Already have an account?
                <a href="login.html">Login here</a>
            </p>

            <p style="margin-top: 12px;">
                <a href="index.html">← Back to Dashboard</a>
            </p>

        </div>

    </div>

</body>
</html>
